# Standalone comparison instance; does not change the existing 8080 server.
worker_processes 1;
pid /tmp/cran-comparison-nginx.pid;
error_log /tmp/cran-comparison-nginx-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;
    keepalive_timeout 65;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        root /mnt/c/Users/User001/r_site/benchmarks/.cache/original;
        index index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        location / { try_files $uri $uri/ =404; }
    }
    server {
        listen 127.0.0.1:8082;
        server_name localhost;
        root /mnt/c/Users/User001/r_site/dist;
        index index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        location / { try_files $uri $uri/ =404; }
    }
}
