# Isolated local test server for Ubuntu WSL.
# Validate/run with: nginx -t -c /mnt/c/Users/User001/r_site/deploy/nginx-wsl.conf
# This file is standalone and does not modify /etc/nginx/nginx.conf.
worker_processes 1;
pid /tmp/cran-redesign-nginx-8080.pid;
error_log /tmp/cran-redesign-nginx-8080-error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 127.0.0.1:8080;
        server_name 127.0.0.1 localhost;
        root /mnt/c/Users/User001/r_site/dist;
        index index.html;
        access_log /tmp/cran-redesign-nginx-8080-access.log;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # HTML and CRAN-generated search data are refreshed together by builds.
        location ^~ /assets/search/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ^~ /assets/search-names/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location ^~ /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "public, max-age=300, must-revalidate" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
}
