# Example TLS virtual host. Replace the hostname and certificate paths, then set
# `root` to the absolute path of the published dist directory.
server {
    listen 443 ssl;
    server_name cran-redesign.example.org;
    root /srv/cran-redesign/dist;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/cran-redesign.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cran-redesign.example.org/privkey.pem;

    # Static HTML routes use directory index files. Do not use an SPA fallback.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Package names and titles change with each build; keep the search index short-lived.
    location = /assets/package-search.json {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

server {
    listen 80;
    server_name cran-redesign.example.org;
    return 301 https://$host$request_uri;
}
