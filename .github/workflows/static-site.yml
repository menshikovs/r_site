name: Static site checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
      - run: npm test
      - run: Rscript tests/export-cran-data.R
      - run: npm run build
      - run: npm run check:site
      - run: python scripts/check_html.py dist
      - run: npm run measure
